<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions | SAS Invention</title>
    
    <link rel="icon" type="image/png" href="images/LOGO.PNG">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-frame">
                    <img src="images/LOGO.PNG" alt="SAS Invention Logo">
                </div>
                <div class="logo-text">
                    SAS INVENTION
                    <small>INSTITUTE</small> 
                </div>
            </a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About Us</a></li>
                    <li><a href="courses.html" class="nav-link">Courses</a></li>
                    <li><a href="admissions.html" class="nav-link">Admissions</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="hero-small">
        <h1>Admissions Open 2024</h1>
        <p>Start your journey with us. Fill out the application form below.</p>
    </div>

    <main>
        <form class="admission-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+1 234 567 890" required>
            </div>
            <div class="form-group">
                <label>Course Interested In</label>
                <select>
                    <option>Computer Science Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Electrical Engineering</option>
                    <option>Web Development Diploma</option>
                </select>
            </div>
            <div class="form-group">
                <label>Previous Education / School</label>
                <input type="text" placeholder="High School Name">
            </div>
            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 SAS Invention. All Rights Reserved.</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
