<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Thank You Note Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN (for JSX compilation in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom font family for Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Basic fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Main App component for the Thank You Note Generator
        function App() {
            // State to hold the current thank you note
            const [thankYouNote, setThankYouNote] = React.useState('');
            // State to hold the receiver's name
            const [receiverName, setReceiverName] = React.useState('');
            // State to hold the sender's name
            const [senderName, setSenderName] = React.useState('');
            // State to hold a confirmation/status message (e.g., "Copied to clipboard")
            const [message, setMessage] = React.useState('');
            // State to control the visibility of sharing options
            const [showShareOptions, setShowShareOptions] = React.useState(false);

            // Array of possible thank you note phrases or templates
            // These are designed to be general and combinable to create diverse notes.
            const noteTemplates = [
                {
                    intro: [
                        "Dear [Name],",
                        "Hi [Name],",
                        "To [Name],",
                        "Hello [Name],"
                    ],
                    body: [
                        "I wanted to express my sincere gratitude for your kindness.",
                        "Thank you so much for your thoughtful gesture.",
                        "I truly appreciate your help with [specific action/item].",
                        "Your support means a lot to me.",
                        "I'm so thankful for everything you've done.",
                        "It was incredibly kind of you to [specific action/item].",
                        "I'm writing to thank you for your generosity.",
                        "Your efforts did not go unnoticed, thank you.",
                        "I am deeply grateful for your assistance.",
                        "Thank you for being so supportive.",
                        "I really appreciate your consideration."
                    ],
                    closing: [
                        "Your thoughtfulness is truly appreciated.",
                        "I couldn't have done it without you.",
                        "You're amazing!",
                        "Thanks again for everything.",
                        "Wishing you all the best.",
                        "With sincere thanks,",
                        "Warmly,",
                        "Best regards,",
                        "Sincerely,",
                        "Gratefully,"
                    ],
                    signature: [
                        "[Your Name]",
                        "A grateful friend,",
                        "Someone who appreciates you,",
                        "Your admirer,"
                    ]
                },
                {
                    intro: [
                        "Dearest [Name],",
                        "My wonderful [Name],"
                    ],
                    body: [
                        "Just a quick note to say how much I appreciate your [quality, e.g., friendship, guidance].",
                        "Your [quality, e.g., wisdom, humor] always brightens my day, thank you.",
                        "Thank you for being such an [adjective, e.g., inspiring, supportive] person."
                    ],
                    closing: [
                        "You're truly one of a kind.",
                        "So glad to have you.",
                        "All the best,"
                    ],
                    signature: [
                        "[Your Name]",
                        "With love,"
                    ]
                }
            ];

            /**
             * Generates a random thank you note by picking random parts
             * from the predefined noteTemplates.
             * Users can replace "[Name]" and "[Your Name]" placeholders with
             * the values from the input fields if provided.
             */
            const generateNote = () => {
                // Clear any previous messages and hide share options
                setMessage('');
                setShowShareOptions(false);

                // Select a random template group
                const templateGroup = noteTemplates[Math.floor(Math.random() * noteTemplates.length)];

                // Pick a random intro, body, closing, and signature
                let intro = templateGroup.intro[Math.floor(Math.random() * templateGroup.intro.length)];
                const body = templateGroup.body[Math.floor(Math.random() * templateGroup.body.length)];
                let closing = templateGroup.closing[Math.floor(Math.random() * templateGroup.closing.length)];
                let signature = templateGroup.signature[Math.floor(Math.random() * templateGroup.signature.length)];

                // Replace placeholders with actual names if provided, otherwise keep placeholders
                intro = receiverName ? intro.replace("[Name]", receiverName) : intro;
                signature = senderName ? signature.replace("[Your Name]", senderName) : signature;

                // Combine them into a full note
                const newNote = `${intro}\n\n${body}\n\n${closing}\n${signature}`;
                setThankYouNote(newNote);
            };

            /**
             * Handles the "Send" action, revealing the sharing options.
             */
            const handleSend = () => {
                if (thankYouNote) {
                    setMessage(''); // Clear any previous status messages
                    setShowShareOptions(true);
                }
            };

            /**
             * Copies the generated thank you note to the clipboard.
             * Provides user feedback using the message state.
             */
            const copyToClipboard = () => {
                if (thankYouNote) {
                    // Create a temporary textarea element to copy text from
                    const textarea = document.createElement('textarea');
                    textarea.value = thankYouNote;
                    document.body.appendChild(textarea);
                    textarea.select(); // Select the text in the textarea
                    try {
                        document.execCommand('copy'); // Execute the copy command
                        setMessage('Note copied to clipboard!');
                    } catch (err) {
                        setMessage('Failed to copy note. Please copy manually.');
                        console.error('Failed to copy:', err);
                    }
                    document.body.removeChild(textarea); // Remove the temporary textarea
                    setShowShareOptions(false); // Hide share options after copying
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-purple-400 to-indigo-600 p-4 font-inter">
                    {/* Container for the app content */}
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg text-center transform transition-all duration-300 hover:scale-105">
                        <h1 className="text-4xl font-extrabold text-gray-800 mb-6 drop-shadow-md">
                            💌 Thank You Note Generator
                        </h1>

                        {/* Input fields for sender and receiver names */}
                        <div className="mb-6 space-y-4">
                            <input
                                type="text"
                                placeholder="Receiver's Name (e.g., John Doe)"
                                className="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-700"
                                value={receiverName}
                                onChange={(e) => setReceiverName(e.target.value)}
                            />
                            <input
                                type="text"
                                placeholder="Your Name (e.g., Jane Smith)"
                                className="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-700"
                                value={senderName}
                                onChange={(e) => setSenderName(e.target.value)}
                            />
                        </div>

                        {/* Buttons for generate and send/share */}
                        <div className="flex justify-center space-x-4 mb-8">
                            <button
                                onClick={generateNote}
                                className="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-300"
                            >
                                Generate New Note
                            </button>

                            {thankYouNote && !showShareOptions && ( // Show send button only if a note is generated and share options are not visible
                                <button
                                    onClick={handleSend}
                                    className="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-300"
                                >
                                    Share Note
                                </button>
                            )}
                        </div>

                        {/* Display area for the generated note */}
                        {thankYouNote && (
                            <div className="bg-gray-50 p-6 rounded-lg border border-gray-200 text-left whitespace-pre-wrap text-gray-700 leading-relaxed shadow-inner animate-fade-in">
                                {thankYouNote}
                                {/* Conditional message if names were not provided */}
                                {(!receiverName || !senderName) && (
                                    <p className="mt-4 text-sm text-gray-500">
                                        <strong className="text-red-500">
                                            {(!receiverName && !senderName) && "Remember to replace '[Name]' and '[Your Name]' if you didn't enter them above!"}
                                            {(!receiverName && senderName) && "Remember to replace '[Name]' if you didn't enter the receiver's name above!"}
                                            {(receiverName && !senderName) && "Remember to replace '[Your Name]' if you didn't enter your name above!"}
                                        </strong>
                                        You can also customize "[specific action/item]", "[quality, e.g., friendship, guidance]", or "[adjective, e.g., inspiring, supportive]".
                                    </p>
                                )}
                                {(receiverName && senderName) && (
                                    <p className="mt-4 text-sm text-gray-500">
                                        You can still customize "[specific action/item]", "[quality, e.g., friendship, guidance]", or "[adjective, e.g., inspiring, supportive]".
                                    </p>
                                )}
                            </div>
                        )}

                        {/* Share options */}
                        {showShareOptions && thankYouNote && (
                            <div className="mt-6 p-4 bg-blue-100 text-blue-800 rounded-lg shadow-md animate-fade-in">
                                <h3 className="text-lg font-semibold mb-3">Share Your Note:</h3>
                                <div className="flex flex-wrap justify-center gap-4">
                                    <a
                                        href={`mailto:?subject=A Thank You Note&body=${encodeURIComponent(thankYouNote)}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex items-center bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-full shadow transition-all duration-300 ease-in-out transform hover:scale-105"
                                    >
                                        <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>
                                        Email
                                    </a>
                                    <a
                                        href={`https://wa.me/?text=${encodeURIComponent(thankYouNote)}`}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex items-center bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full shadow transition-all duration-300 ease-in-out transform hover:scale-105"
                                    >
                                        <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM7 9a1 1 0 000 2h6a1 1 0 100-2H7z" clipRule="evenodd"></path></svg>
                                        WhatsApp
                                    </a>
                                    <button
                                        onClick={copyToClipboard}
                                        className="flex items-center bg-gray-600 hover:bg-gray-800 text-white font-bold py-2 px-4 rounded-full shadow transition-all duration-300 ease-in-out transform hover:scale-105"
                                    >
                                        <svg className="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"></path><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2H6zM5 9a1 1 0 011-1h8a1 1 0 110 2H6a1 1 0 01-1-1z"></path></svg>
                                        Copy to Clipboard
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Confirmation/Status message */}
                        {message && (
                            <div className="mt-6 p-4 bg-blue-100 text-blue-800 rounded-lg shadow-md animate-fade-in">
                                {message}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Render the App component into the 'root' div
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
